name: CI Tests

permissions:
  pull-requests: write
  contents: write
  packages: write
on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_call:

jobs:
  lint-and-docs:
    name: Linting
    runs-on: ubuntu-latest
    # The same recipes `just lint`, `just types` and `just docs` run in the
    # dev container, run here straight on the runner.
    env:
      JUST: just -f dev-env/container.just -d .

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install packages
        run: python3 -m pip install -e .[dev]
      - name: Linting
        run: $JUST lint
      - name: Type checking
        if: ${{ !cancelled() }}
        run: $JUST types
      - name: Docs
        if: ${{ !cancelled() }}
        run: $JUST docs

  integration_tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        include:
          - extra: fastapi
            import: FastApiOIDCAuth
          - extra: flask
            import: FlaskOIDCAuth
          - extra: quart
            import: QuartOIDCAuth
          - extra: litestar
            import: LitestarOIDCAuth
          - extra: django
            import: DjangoOIDCAuth
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
      - name: Install dependencies for ${{ matrix.extra }}
        run: python3 -m pip install .[${{ matrix.extra }}] -c .github/dependabot/constraints.txt
      - name: Verify import
        run: python3 -c "from py_oidc_auth import ${{ matrix.import }}"

  tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version}}
      - name: Install dependencies
        run: python3 -m pip install -e .[dev]
      - name: Set up services
        # Only Keycloak and the user bootstrap: the dev services are in the
        # "dev" profile.
        run: docker compose -f dev-env/docker-compose.yaml up -d
      - name: Run tests
        # Waits for Keycloak, runs the suite with coverage, as `just test`.
        run: just -f dev-env/container.just -d . test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: freva-org/py-oidc-auth
          verbose: true

  dependabot:
    name: Merge PR by dependabot
    runs-on: ubuntu-latest
    needs: [tests, lint-and-docs]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FREVA_BOT_APP_ID }}
          private-key: ${{ secrets.FREVA_BOT_PRIVATE_KEY }}
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Approve dependabot's PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Auto-merge for dependabot's PR
        run: gh pr merge --merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
