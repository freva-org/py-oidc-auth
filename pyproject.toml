[build-system]
requires = ["flit_core >=3.2"]
build-backend = "flit_core.buildapi"
[project]
name = "py-oidc-auth"
description = "Pluggable OIDC/OAuth 2.1 authentication routes and token validation."
authors = [{name = "DKRZ, Clint", email = "freva@dkrz.de"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
               "Development Status :: 4 - Beta",
               "Intended Audience :: Developers",
               "License :: OSI Approved :: BSD License",
               "Operating System :: POSIX :: Linux",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13",
               "Programming Language :: Python :: 3.14",
               "Programming Language :: Python :: 3.15",
               "Framework :: FastAPI",
               "Framework :: Flask",
               "Framework :: Django",
               "Topic :: Internet :: WWW/HTTP :: Session",
               "Topic :: Security",
               "Topic :: Software Development :: Libraries :: Python Modules",
               "Topic :: System :: Systems Administration :: Authentication/Directory",
               "Typing :: Typed",
               "Operating System :: OS Independent",
               "Environment :: Web Environment",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite",
    "httpx",
    "pydantic",
    "platformdirs",
    "PyJWT[crypto]",
    "sqlalchemy[asyncio]",
    "typing_extensions",
]
[project.urls]
Documentation = "https://py-oidc-auth.readthedocs.io"
Issues = "https://github.com/freva-org/py-oidc-auth/issues"
Source = "https://github.com/freva-org/py-oidc-auth/"

[project.optional-dependencies]
fastapi = ["fastapi", "python-multipart", "uvicorn"]
flask = ["flask"]
quart = ["quart"]
tornado = ["tornado"]
litestar = ["litestar>=2.23"]
django = ["django>=4.0"]
dev = ["cryptography",
       "uvicorn",
       "watchfiles",
       "rust-just",
       "py-oidc-auth[all,tests,lint,docs]",
       ]
all = ["py-oidc-auth[fastapi,flask,quart,tornado,litestar,django]"]
tests = ["pytest",
         "pytest-env",
         "pymongo",
         "httpx",
         "mock",
         "pytest-mock",
         "pytest-cov",
         "pytest-asyncio",
         "requests",
         "uvicorn",
         "asyncpg",
         "aiomysql",
         ]
lint = ["black",
        "isort",
        "flake8",
        "pytest-stub",
        "pydocstyle",
        "codespell",
        "bandit[toml]",
        "mypy",
        ]
docs = ["sphinx-execute-code-python3",
        "sphinx-code-tabs",
        "sphinx-copybutton",
        "sphinx-sitemap",
        "sphinx-togglebutton",
        "sphinxcontrib-httpdomain",
        "sphinxext-opengraph",
        "sphinx-design",
        "pydata-sphinx-theme"
        ]
[package-data]
freva_auth = ["py.typed"]



[tool.pytest.ini_options]
log_cli = false
log_cli_level = "ERROR"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn"
]

[tool.flake8]
ignore = ["F405", "F403", "E704", "D107"]
[tool.pydocstyle]
add_ignore = ["D107"]

[tool.mypy]
files = "src"
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
install_types = true
non_interactive = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
ignore_missing_imports = true
allow_untyped_calls = true

[tool.isort]
known_first_party = ["oidc_auth"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise ImportError",
    "except ImportError",
]
